<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bookbuster Admin">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root{
    --bg:#FAF7F2; --ink:#2C1810; --muted:#7C6F64; --accent:#8B4513;
    --border:#E8E0D5; --card:#fff;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-tap-highlight-color:transparent;
  }

  /* ── Pantalla de PIN ─────────────────────────────────────────── */
  #lock-screen{
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    justify-content:center; padding:24px; text-align:center;
  }
  #lock-screen .ico{font-size:2.6rem;margin-bottom:10px;}
  #lock-screen h1{font-size:1.2rem;margin-bottom:4px;}
  #lock-screen p{color:var(--muted);font-size:.85rem;margin-bottom:20px;}
  #pin-input{
    width:180px; text-align:center; font-size:1.6rem; letter-spacing:.4em;
    padding:12px 10px 12px 16px; border:1.5px solid var(--border); border-radius:12px;
    background:var(--card); color:var(--ink); -webkit-appearance:none; appearance:none;
  }
  #pin-input:focus{outline:none;border-color:var(--accent);}
  #lock-screen .btn-entrar{
    margin-top:14px; width:180px; padding:11px; border:none; border-radius:10px;
    background:var(--accent); color:#fff; font-weight:700; font-size:.95rem; cursor:pointer;
  }
  #lock-screen .btn-entrar:disabled{opacity:.45;}
  #lock-err{color:#C0392B;font-size:.82rem;margin-top:10px;min-height:1.2em;}

  /* ── Shell principal ─────────────────────────────────────────── */
  #app-shell{display:none;min-height:100vh;flex-direction:column;}
  #app-shell.show{display:flex;}
  header.topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;background:var(--card);border-bottom:1px solid var(--border);
  }
  header.topbar h1{font-size:1rem;}
  header.topbar .salir{font-size:.8rem;color:var(--muted);text-decoration:underline;cursor:pointer;background:none;border:none;font-family:inherit;}

  main{flex:1;padding:16px 16px 90px;max-width:560px;margin:0 auto;width:100%;}
  .seccion{display:none;}
  .seccion.show{display:block;}
  .placeholder{
    text-align:center;padding:60px 20px;color:var(--muted);font-size:.9rem;
  }
  .placeholder .ico{font-size:2rem;margin-bottom:8px;display:block;}

  nav.bottom-nav{
    position:fixed;left:0;right:0;bottom:0;background:var(--card);
    border-top:1px solid var(--border);display:flex;
    padding-bottom:env(safe-area-inset-bottom);
  }
  nav.bottom-nav button{
    flex:1;background:none;border:none;font-family:inherit;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;
    padding:9px 4px 8px;color:var(--muted);font-size:.68rem;font-weight:600;
  }
  nav.bottom-nav button .ico{font-size:1.25rem;}
  nav.bottom-nav button.on{color:var(--accent);}
</style>
</head>
<body>

<div id="lock-screen">
  <div class="ico">🔒</div>
  <h1>Bookbuster Admin</h1>
  <p>Ingresá tu PIN para entrar</p>
  <input type="password" id="pin-input" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="····" autocomplete="off">
  <button class="btn-entrar" id="btn-entrar" onclick="intentarEntrar()">Entrar</button>
  <div id="lock-err"></div>
</div>

<div id="app-shell">
  <header class="topbar">
    <h1 id="titulo-seccion">📦 Remitos</h1>
    <button class="salir" onclick="salir()">Salir</button>
  </header>

  <main>
    <div class="seccion show" id="sec-remitos">
      <div class="placeholder"><span class="ico">📦</span>Nuevo remito de entrega/retiro — próximamente</div>
    </div>
    <div class="seccion" id="sec-encargos">
      <div class="placeholder"><span class="ico">📩</span>Gestionar encargo — próximamente</div>
    </div>
    <div class="seccion" id="sec-deudas">
      <div class="placeholder"><span class="ico">💰</span>Deudas de café — próximamente</div>
    </div>
    <div class="seccion" id="sec-dashboard">
      <div class="placeholder"><span class="ico">📊</span>Dashboard de ventas — próximamente</div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="on" data-sec="remitos" data-titulo="📦 Remitos" onclick="irA('remitos', this)">
      <span class="ico">📦</span>Remitos
    </button>
    <button data-sec="encargos" data-titulo="📩 Encargos" onclick="irA('encargos', this)">
      <span class="ico">📩</span>Encargos
    </button>
    <button data-sec="deudas" data-titulo="💰 Deudas" onclick="irA('deudas', this)">
      <span class="ico">💰</span>Deudas
    </button>
    <button data-sec="dashboard" data-titulo="📊 Dashboard" onclick="irA('dashboard', this)">
      <span class="ico">📊</span>Dashboard
    </button>
  </nav>
</div>

<script>
const PIN_KEY = 'bbAdminPin';

window.onload = function(){
  const pinGuardado = localStorage.getItem(PIN_KEY);
  if (pinGuardado) {
    google.script.run
      .withSuccessHandler(function(res){
        if (res.ok) { desbloquear(); }
        else { localStorage.removeItem(PIN_KEY); }
      })
      .withFailureHandler(function(){})
      .adminVerificarPin(pinGuardado);
  }
  document.getElementById('pin-input').addEventListener('keydown', function(e){
    if (e.key === 'Enter') intentarEntrar();
  });
};

function intentarEntrar(){
  const pin = document.getElementById('pin-input').value.trim();
  if (!pin) return;
  const btn = document.getElementById('btn-entrar');
  btn.disabled = true; btn.textContent = 'Verificando...';
  google.script.run
    .withSuccessHandler(function(res){
      btn.disabled = false; btn.textContent = 'Entrar';
      if (res.ok) {
        localStorage.setItem(PIN_KEY, pin);
        desbloquear();
      } else {
        document.getElementById('lock-err').textContent = 'PIN incorrecto.';
        document.getElementById('pin-input').value = '';
      }
    })
    .withFailureHandler(function(){
      btn.disabled = false; btn.textContent = 'Entrar';
      document.getElementById('lock-err').textContent = 'Error de conexión. Probá de nuevo.';
    })
    .adminVerificarPin(pin);
}

function desbloquear(){
  document.getElementById('lock-screen').style.display = 'none';
  document.getElementById('app-shell').classList.add('show');
}

function salir(){
  localStorage.removeItem(PIN_KEY);
  document.getElementById('app-shell').classList.remove('show');
  document.getElementById('lock-screen').style.display = '';
  document.getElementById('pin-input').value = '';
}

function irA(sec, btn){
  document.querySelectorAll('.seccion').forEach(s => s.classList.remove('show'));
  document.getElementById('sec-' + sec).classList.add('show');
  document.querySelectorAll('nav.bottom-nav button').forEach(b => b.classList.remove('on'));
  btn.classList.add('on');
  document.getElementById('titulo-seccion').textContent = btn.dataset.titulo;
}

// Helper para las pantallas que vienen (remitos, encargos, deudas,
// dashboard): todas las acciones del panel pasan por acá, que agrega
// el PIN guardado automáticamente a cada llamada.
function adminCall(fnName, args, onSuccess, onFail){
  const pin = localStorage.getItem(PIN_KEY) || '';
  google.script.run
    .withSuccessHandler(onSuccess)
    .withFailureHandler(onFail || function(err){ alert('Error: ' + err.message); })
    [fnName].apply(null, [pin].concat(args || []));
}
</script>
</body>
</html>
